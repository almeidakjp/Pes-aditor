plugins {
    id 'com.android.application'
}

android {
    namespace 'com.peseditor'
    compileSdk 35
    buildToolsVersion '35.0.0'

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId 'com.peseditor'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}


dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
